name: checks
# Runs checks/run.sh (tests, vault links, bank lint) in the same Docker image
# used locally with `docker compose run --rm checks`, so CI and laptops share
# one Python version (python:3.9-slim) instead of depending on what the runner
# image happens to ship.
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build checks
      - run: docker compose run --rm checks
