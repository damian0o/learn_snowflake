name: pages
# Builds the Obsidian vault into a static site with Quartz and deploys it to
# GitHub Pages. Quartz itself is not vendored: it is cloned at a pinned tag and
# our two overlay files in site/ replace its default config and layout.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  QUARTZ_TAG: v4.5.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Quartz
        run: git clone --quiet --depth 1 --branch "$QUARTZ_TAG" https://github.com/jackyzha0/quartz.git _quartz
      - name: Apply overlay
        run: cp site/quartz.config.ts site/quartz.layout.ts _quartz/
      - name: Stage vault as content
        run: python3 tools/stage_site.py vault _quartz/content
      - name: Install Quartz
        working-directory: _quartz
        run: npm ci --no-audit --no-fund
      - name: Build site
        working-directory: _quartz
        run: npx quartz build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
