services:
  quiz:
    build: .
    image: learn-snowflake-quiz
    stdin_open: true   # the quiz reads your answers
    tty: true
    volumes:
      - ./quiz/results:/app/quiz/results   # scores persist on the host
      - ./quiz/bank:/app/quiz/bank:ro      # edit questions without rebuilding
    # usage: docker compose run --rm quiz day1 | review | stats

  checks:
    build:
      context: .
      dockerfile: checks/Dockerfile
    image: learn-snowflake-checks
    volumes:
      - ./quiz:/app/quiz:ro
      - ./tools:/app/tools:ro
      - ./vault:/app/vault:ro
    # usage: docker compose run --rm checks
